name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Logic to switch regions and names based on branch
      REGION: ${{ github.event.workflow_run.head_branch == 'main' && 'asia-east1' || 'northamerica-northeast1' }}
      SERVICE_NAME: ${{ github.event.workflow_run.head_branch == 'main' && 'maramap-backend-prod' || 'maramap-backend-dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: 'github-actions-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/maramap-backend/maramap-backend:${{ github.event.workflow_run.head_sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ steps.build.outputs.image }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --timeout=3600 \
            --memory=1Gi \
            --set-secrets="SUPABASE_URL=supabase_url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase_service_role_key:latest,GEMINI_API_KEY=gemini_api_key:latest,USER_ID=user_id:latest,R2_ACCESS_KEY_ID=r2_access_key_id:latest,R2_SECRET_ACCESS_KEY=r2_secret_access_key:latest,R2_ENDPOINT=r2_endpoint:latest,R2_BUCKET_NAME=r2_bucket_name:latest,R2_PUBLIC_URL=r2_public_url:latest"
